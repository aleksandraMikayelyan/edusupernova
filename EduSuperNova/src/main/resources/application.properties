server.port=${PORT:8080}
spring.application.name=edusupernova

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.security.jwt-secret=${JWT_SECRET}

# ─── Groq API ─────────────────────────────────────────────────────────────────
groq.api.key=${GROQ_API_KEY}

# ─── Google OAuth2 ────────────────────────────────────────────────────────────
google.oauth2.client-id=${GOOGLE_CLIENT_ID}

# ─── Mail (SMTP) ──────────────────────────────────────────────────────────────
# Configura estas variables en tu .env:
#   MAIL_HOST=smtp.gmail.com
#   MAIL_PORT=587
#   MAIL_USERNAME=tu_cuenta@gmail.com
#   MAIL_PASSWORD=tu_app_password_de_16_caracteres
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# From address shown on outgoing emails
app.email.from=${MAIL_FROM:onboarding@resend.dev}

# TTL of the verification code in minutes (default 10)
app.verification.code-ttl-minutes=${VERIFICATION_CODE_TTL:10}

# ─── Threading ────────────────────────────────────────────────────────────────
spring.threads.virtual.enabled=true
spring.task.execution.pool.core-size=1

# ─── HikariCP — tuned for Supabase which closes idle connections ~5 min ───────
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000

# ─── File Storage (External Images) ───────────────────────────────────────────
# Default is the local Windows dev path. Override by setting UPLOAD_DIR in the
# deployment environment (Render, Docker, etc.) — e.g. UPLOAD_DIR=/app/uploads/
app.file.upload-dir=${UPLOAD_DIR:C:/images/}
# Public base URL of this backend, used to turn relative image paths into absolute URLs
# that the frontend (served on a different origin) can load directly.
# Must be set in production, e.g. https://edusupernova.onrender.com
app.base-url=${BASE_URL:}
spring.datasource.hikari.minimum-idle=0
